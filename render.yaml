services:
  # 1. Backend API (NestJS)
  - type: web
    name: fintech-api
    env: docker
    dockerContext: . # Needs root context for access to packages/database
    dockerfilePath: apps/api/Dockerfile
    plan: free
    repo: https://github.com/vivekapadia/fintechManager # Optional, Render infers usually
    envVars:
      - key: DATABASE_URL
        sync: false # User will input this manually in Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: ENGINE_URL
        fromService:
          type: web
          name: fintech-engine
          envVarKey: RENDER_EXTERNAL_URL # Use Public URL for communication

  # 2. Calculation Engine (Python)
  - type: web
    name: fintech-engine
    env: docker
    dockerContext: . # Root context is safer for monorepos
    dockerfilePath: apps/engine/Dockerfile # Explicit path from root, not context
    plan: free
    envVars:
      - key: PORT
        value: 8000
